<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对弈阁 · Game Hall</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 大厅页专属样式：复用 styles.css 的色板与字体，保持水墨茶室风格 */
  .hall {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 0 40px;
  }

  .hall-header {
    text-align: center;
    margin: 18px 0 8px;
  }
  .hall-header .title-row {
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }
  .hall-header h1 {
    font-size: clamp(40px, 7vw, 64px);
    color: var(--ivory);
    letter-spacing: 0.18em;
    line-height: 1;
  }
  .hall-header .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: var(--cinnabar);
    color: #fff;
    font-family: "Ma Shan Zheng", "STKaiti", serif;
    font-size: 26px;
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--cinnabar-dk), 0 6px 18px rgba(0,0,0,.35);
    transform: rotate(-4deg);
  }
  .hall-header .subtitle {
    margin-top: 10px;
    font-size: clamp(14px, 1.6vw, 18px);
    letter-spacing: 0.45em;
    color: var(--ivory-dim);
    text-transform: uppercase;
  }
  .hall-header .deco {
    margin: 18px auto 0;
    width: 60%;
    max-width: 320px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--bronze) 50%, transparent);
    position: relative;
  }
  .hall-header .deco::before {
    content: "✦";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-solid, #1a130c);
    color: var(--bronze);
    padding: 0 12px;
    font-size: 14px;
  }

  .hall-intro {
    text-align: center;
    margin: 22px auto 36px;
    max-width: 560px;
    color: var(--ivory-soft);
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 0.04em;
  }

  /* — 游戏卡片网格 — */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
    margin-top: 10px;
  }

  .game-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 22px 24px;
    background:
      linear-gradient(180deg, rgba(247, 230, 196, 0.06), rgba(247, 230, 196, 0.02)),
      var(--panel);
    border: 1px solid rgba(201, 162, 95, 0.28);
    border-radius: 14px;
    text-decoration: none;
    color: var(--ivory);
    cursor: pointer;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s, box-shadow .35s;
  }
  .game-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(180px 120px at 50% -10%, rgba(222, 168, 96, 0.18), transparent 70%);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  .game-card:hover {
    transform: translateY(-4px);
    border-color: var(--bronze);
    box-shadow: 0 14px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(201,162,95,.4);
  }
  .game-card:hover::before { opacity: 1; }

  .game-card .symbol {
    width: 78px;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,235,200,.18), rgba(40,28,18,.6));
    border: 1px solid rgba(201,162,95,.35);
    font-family: "Ma Shan Zheng", "STKaiti", serif;
    font-size: 40px;
    color: var(--bronze);
    margin-bottom: 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }

  .game-card .name {
    font-size: 24px;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .game-card .latin {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--ivory-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .game-card .desc {
    font-size: 13px;
    color: var(--ivory-soft);
    opacity: 0.78;
    line-height: 1.7;
    text-align: center;
    margin-bottom: 14px;
    min-height: 36px;
  }
  .game-card .enter {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--bronze);
    padding: 7px 18px;
    border: 1px solid rgba(201,162,95,.4);
    border-radius: 999px;
    transition: background .3s, color .3s;
  }
  .game-card:hover .enter {
    background: var(--bronze);
    color: var(--ink);
  }
  .game-card .enter svg {
    width: 14px;
    height: 14px;
  }

  /* 卡片右上角的状态徽章 */
  .game-card .badge {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 11px;
    letter-spacing: 0.2em;
    padding: 3px 9px;
    border-radius: 4px;
    background: var(--cinnabar);
    color: #fff;
  }
  .game-card .badge.soon {
    background: transparent;
    border: 1px solid var(--ivory-dim);
    color: var(--ivory-dim);
  }

  /* 占位卡：未上线游戏 */
  .game-card.coming {
    cursor: default;
    opacity: 0.65;
  }
  .game-card.coming:hover {
    transform: none;
    border-color: rgba(201, 162, 95, 0.28);
    box-shadow: none;
  }
  .game-card.coming:hover::before { opacity: 0; }
  .game-card.coming .enter {
    border-color: var(--ivory-dim);
    color: var(--ivory-dim);
  }

  .hall-footer {
    text-align: center;
    margin-top: 48px;
    color: var(--ivory-dim);
    font-size: 12px;
    letter-spacing: 0.3em;
  }
  .hall-footer .line {
    display: block;
    width: 120px;
    height: 1px;
    margin: 0 auto 14px;
    background: linear-gradient(90deg, transparent, var(--ivory-dim), transparent);
  }

  @media (max-width: 560px) {
    .games-grid { grid-template-columns: 1fr; }
    .hall-header h1 { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="watermark" aria-hidden="true">弈</div>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="hall">
  <header class="hall-header">
    <div class="title-row">
      <h1 class="brush">对弈阁</h1>
      <span class="seal" aria-hidden="true">弈</span>
    </div>
    <div class="subtitle latin">Game Hall</div>
    <div class="deco"><span></span></div>
  </header>

  <p class="hall-intro">
    一方木匣，黑白纵横。<br>
    于茶室一角，慢品对局之乐。
  </p>

  <!--
    游戏入口卡片：
    · 已上线游戏移除 .coming 类，链接指向对应页面，并将徽章文字改为 "可对弈"
    · 新增游戏：复制下方 <a class="game-card"> 块，替换 symbol/name/latin/desc/href 即可
  -->
  <section class="games-grid" aria-label="游戏列表">

    <a class="game-card" href="gomoku.html">
      <span class="badge">可对弈</span>
      <div class="symbol">五</div>
      <div class="name brush">五子棋</div>
      <div class="latin">Gomoku</div>
      <p class="desc">黑白交替，五珠连珠即胜。支持人机对弈与三档难度。</p>
      <span class="enter">
        入局
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </span>
    </a>

    <a class="game-card coming" href="#" aria-disabled="true">
      <span class="badge soon">敬请期待</span>
      <div class="symbol">·</div>
      <div class="name brush">空位</div>
      <div class="latin">Coming Soon</div>
      <p class="desc">新游戏筹备中，留座以待。</p>
      <span class="enter">未开放</span>
    </a>

    <a class="game-card coming" href="#" aria-disabled="true">
      <span class="badge soon">敬请期待</span>
      <div class="symbol">·</div>
      <div class="name brush">空位</div>
      <div class="latin">Coming Soon</div>
      <p class="desc">新游戏筹备中，留座以待。</p>
      <span class="enter">未开放</span>
    </a>

  </section>

  <footer class="hall-footer">
    <span class="line"></span>
    对弈阁 · 慢棋细品
  </footer>
</main>

<script>
  // 复用 gomoku.html 的浮尘氛围生成逻辑，保持视觉一致
  (function () {
    var motes = document.getElementById('motes');
    if (!motes) return;
    var N = 18;
    for (var i = 0; i < N; i++) {
      var m = document.createElement('span');
      m.className = 'mote';
      var size = 2 + Math.random() * 3;
      m.style.width = size + 'px';
      m.style.height = size + 'px';
      m.style.left = (Math.random() * 100) + '%';
      m.style.animationDuration = (14 + Math.random() * 16) + 's';
      m.style.animationDelay = (-Math.random() * 20) + 's';
      motes.appendChild(m);
    }
  })();
</script>

</body>
</html>
